<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nurseIA — Asistente Clínico de Enfermería</title>
  <meta name="description" content="Copiloto inteligente para diagnósticos enfermeros y priorización ABCDE">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
          },
          colors: {
            iris: {
              50:  '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            slate: {
              950: '#0a0f1e',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --iris: #7c3aed;
      --iris-light: #ede9fe;
      --ink: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sidebar */
    .sidebar { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), width 0.3s ease; }
    .sidebar-collapsed { width: 72px; }
    .sidebar-expanded { width: 240px; }

    /* Cards */
    .diag-card { animation: slideUp 0.35s ease-out both; }
    .diag-card:nth-child(1) { animation-delay: 0.05s; }
    .diag-card:nth-child(2) { animation-delay: 0.1s; }
    .diag-card:nth-child(3) { animation-delay: 0.15s; }
    .diag-card:nth-child(4) { animation-delay: 0.2s; }
    .diag-card:nth-child(5) { animation-delay: 0.25s; }

    /* ABCDE pill colors */
    .pill-ab   { background:#fee2e2; color:#991b1b; }
    .pill-c    { background:#fef3c7; color:#92400e; }
    .pill-cd   { background:#fef3c7; color:#92400e; }
    .pill-d    { background:#dbeafe; color:#1e40af; }
    .pill-de   { background:#dcfce7; color:#166534; }
    .pill-cde  { background:#fef3c7; color:#92400e; }
    .pill-bc   { background:#fee2e2; color:#991b1b; }
    .pill-e    { background:#dcfce7; color:#166534; }
    .dark .pill-ab  { background:#7f1d1d; color:#fca5a5; }
    .dark .pill-c   { background:#78350f; color:#fcd34d; }
    .dark .pill-cd  { background:#78350f; color:#fcd34d; }
    .dark .pill-d   { background:#1e3a5f; color:#93c5fd; }
    .dark .pill-de  { background:#14532d; color:#86efac; }
    .dark .pill-cde { background:#78350f; color:#fcd34d; }
    .dark .pill-bc  { background:#7f1d1d; color:#fca5a5; }
    .dark .pill-e   { background:#14532d; color:#86efac; }

    /* Textarea custom scroll */
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 4px; }

    /* History items */
    .history-item { transition: background 0.15s; cursor: pointer; }
    .history-item:hover { background: rgba(124,58,237,0.06); }

    /* Glow on critical alert */
    @keyframes alertGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%        { box-shadow: 0 0 0 6px rgba(239,68,68,0.15); }
    }
    .critical-glow { animation: alertGlow 2s ease-in-out infinite; }

    /* Tab active */
    .tab-active { border-bottom: 2px solid #7c3aed; color: #7c3aed; }
    .dark .tab-active { color: #a78bfa; border-color: #a78bfa; }

    /* Progress ring */
    .ring-track { stroke: #e2e8f0; }
    .dark .ring-track { stroke: #334155; }
    .ring-fill { stroke: #7c3aed; transition: stroke-dashoffset 0.6s ease; }

    /* Triage map cama */
    .cama { transition: all 0.2s ease; cursor: pointer; border-radius: 10px; }
    .cama:hover { transform: scale(1.05); }
    .cama-rojo    { background: #fee2e2; border: 2px solid #ef4444; }
    .cama-naranja { background: #fff7ed; border: 2px solid #f97316; }
    .cama-verde   { background: #f0fdf4; border: 2px solid #22c55e; }
    .cama-vacia   { background: #f8fafc; border: 2px dashed #cbd5e1; }
    .dark .cama-rojo    { background: #450a0a; border-color: #ef4444; }
    .dark .cama-naranja { background: #431407; border-color: #f97316; }
    .dark .cama-verde   { background: #052e16; border-color: #22c55e; }
    .dark .cama-vacia   { background: #1e293b; border-color: #475569; }

    /* Smooth section transitions */
    .section-panel { animation: fadeIn 0.3s ease-out; }

    /* Result prose */
    #generatedEvolution { font-size: 0.875rem; line-height: 1.75; white-space: pre-wrap; }

    /* Chat bubble */
    .chat-bubble-ai   { background: #f5f3ff; border: 1px solid #ddd6fe; }
    .chat-bubble-user { background: #7c3aed; color: white; }
    .dark .chat-bubble-ai { background: #1e1b4b; border-color: #4338ca; color: #e0e7ff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
